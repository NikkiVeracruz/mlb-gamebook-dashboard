name: MLB three-day archive-first rehearsal (staging)
on:
  push:
    branches: [staging-mlb-three-day-archive-2026-11-23]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyyaml
      - name: Validate YAML, Python, and MLB browser JavaScript
        run: |
          python -m py_compile monitor.py archive.py three_day_window.py
          python - <<'PY'
          import yaml
          from pathlib import Path
          for filename in (".github/workflows/three-day-rollover.yml",".github/workflows/update.yml"):
              with open(filename) as file:
                  assert "jobs" in yaml.safe_load(file)
          source=Path("index.html").read_text()
          first=source.index("<script>")+len("<script>")
          last=source.index("</script>",first)
          script=source[first:last]
          assert "threeDisplayDates" in script and "lastWindowKey" in script
          Path("/tmp/mlb-rolling-frontend.js").write_text(script)
          PY
          node --check /tmp/mlb-rolling-frontend.js
      - name: Test exact dates, simulated doubleheaders, DST and archive protections
        run: |
          python -m unittest discover -s tests -p 'test_three_day_window.py' -v
          python -m unittest discover -s tests -p 'test_mlb_three_day_feed.py' -v
          python -m unittest discover -s tests -p 'test_archive_safety.py' -v
      - name: Run read-only MLB live feed rehearsal
        run: |
          python monitor.py
          python archive.py
          python tests/archive_integrity_gate.py archive.json
          python - <<'PY'
          import json
          from pathlib import Path
          from three_day_window import three_days
          data=json.loads(Path("gamebooks.json").read_text())
          days=[d.isoformat() for d in three_days()]
          assert len(days)==3 and data["window_dates"]==days
          assert all(g["date"] in days for g in data["games"])
          print("MLB rolling date range verified:",days)
          PY
